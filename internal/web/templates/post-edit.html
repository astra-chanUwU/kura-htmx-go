{{define "post-edit"}}{{template "head" .}}{{template "nav" .}}<main id="main" class="form-page"><a href="/posts/{{.Post.ID}}">← Post #{{.Post.ID}}</a><h1>Edit metadata</h1><form method="post" class="stack"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Tags{{template "tag-autocomplete-input" .}}</label><label>Source<input type="url" name="source" value="{{.Post.Source}}"></label><label>Status<select name="status"><option value="draft"{{if eq .Post.Status "draft"}} selected{{end}}>Draft</option><option value="published"{{if eq .Post.Status "published"}} selected{{end}}>Published</option></select></label><button>Save metadata</button></form>{{if .User.CanDelete .Post}}<form method="post" action="/posts/{{.Post.ID}}/delete" class="danger-zone"><input type="hidden" name="csrf" value="{{.CSRF}}"><p>Deleting hides the post and retains its original and thumbnail for explicit maintenance.</p><button>Delete post</button></form>{{end}}</main>{{template "foot" .}}{{end}}
