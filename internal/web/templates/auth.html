{{define "auth"}}{{template "head" .}}{{template "nav" .}}<main id="main" class="form-page"><h1>{{if eq .Title "Register — Kura"}}Create account{{else}}Sign in{{end}}</h1>{{if .Error}}<p class="alert">{{.Error}}</p>{{end}}<form method="post" class="stack"><input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="next" value="{{.Next}}"><label>Username<input name="username" autocomplete="username" required minlength="3" maxlength="32"></label><label>Password<input type="password" name="password" autocomplete="{{if eq .Title "Register — Kura"}}new-password{{else}}current-password{{end}}" required minlength="10"></label><button>{{if eq .Title "Register — Kura"}}Register{{else}}Sign in{{end}}</button></form></main>{{template "foot" .}}{{end}}
