{{define "head"}}<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}}</title>
<script src="/static/theme.js"></script>
<link rel="preload" href="/static/fonts/AtkinsonHyperlegible-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/kura.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body><a class="skip-link" href="#main">Skip to content</a>{{end}}
{{define "nav"}}
<header class="site-header">
<a class="brand" href="/"{{if eq .ActiveNav "home"}} aria-current="page"{{end}}>Kura</a>
<nav aria-label="Primary"><a href="/posts"{{if eq .ActiveNav "posts"}} aria-current="page"{{end}}>Posts</a><a href="/pools"{{if eq .ActiveNav "pools"}} aria-current="page"{{end}}>Pools</a><a href="/random">Random</a>{{if .User}}{{if .User.CanUpload}}<a href="/uploads/new"{{if eq .ActiveNav "upload"}} aria-current="page"{{end}}>Upload</a>{{end}}{{if .User.CanAdminister}}<a href="/admin/accounts"{{if eq .ActiveNav "admin"}} aria-current="page"{{end}}>Admin</a>{{end}}{{end}}</nav>
<div class="session-nav">{{if .User}}<a href="/account"{{if eq .ActiveNav "account"}} aria-current="page"{{end}}>{{.User.Username}}</a><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="link-button">Sign out</button></form>{{else}}<a href="/login"{{if eq .ActiveNav "account"}} aria-current="page"{{end}}>Sign in</a><a href="/register">Register</a>{{end}}</div>
<button class="theme-toggle" type="button" data-theme-toggle aria-label="Light theme" aria-pressed="false" hidden>Light theme</button>
</header>{{end}}
{{define "foot"}}</body></html>{{end}}
