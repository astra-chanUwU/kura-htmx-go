{{define "pools"}}{{template "head" .}}{{template "nav" .}}<main id="main" class="narrow"><div class="title-row"><div><h1>Pools</h1><p class="lede">Ordered collections of related posts.</p></div>{{if .User}}<a class="button" href="/pools/new">New pool</a>{{end}}</div><div class="pool-list">{{range .Pools}}<a href="/pools/{{.Slug}}"><b>{{.Name}}{{if eq .Status "draft"}} <em>draft</em>{{end}}</b><span>{{.Description}}</span><small>{{.Count}} posts</small></a>{{else}}<div class="empty">No published pools yet.</div>{{end}}</div></main>{{template "foot" .}}{{end}}
