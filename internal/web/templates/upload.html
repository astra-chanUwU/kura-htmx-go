{{define "upload"}}
{{template "head" .}}
{{template "nav" .}}
<main id="main" class="form-page upload-page">
  <header class="upload-header">
    <h1>Upload image</h1>
    <p class="lede">JPEG, PNG, or GIF · maximum 32 MB · exact duplicates are rejected</p>
  </header>
  {{if .Error}}<p class="alert">{{.Error}}</p>{{end}}
  <form method="post" action="/uploads" enctype="multipart/form-data" class="stack upload-form" id="upload-form">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <section class="upload-section">
      <label class="dropzone" id="dropzone">
        <strong>Image</strong>
        <input type="file" name="image" id="image-input" accept="image/jpeg,image/png,image/gif" required>
        <span>Choose, drop, or paste an image</span>
        <img id="preview" alt="Upload preview" hidden>
      </label>
    </section>
    <div class="upload-fields" aria-label="Image details">
      <label>Tags <small>space-separated; new tags use the general category</small><input name="tags" placeholder="character_name series_name"></label>
      <label>Source<input type="url" name="source" placeholder="https://…"></label>
      <label>Status<select name="status"><option value="published" selected>Published — visible immediately</option><option value="draft">Draft — review first</option></select></label>
    </div>
    <button class="primary-action" type="submit">Store image</button>
  </form>
</main>
<script>(()=>{const input=document.querySelector('#image-input'),zone=document.querySelector('#dropzone'),preview=document.querySelector('#preview');function show(file){if(!file)return;preview.src=URL.createObjectURL(file);preview.hidden=false}input.addEventListener('change',()=>show(input.files[0]));zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('active')});zone.addEventListener('dragleave',()=>zone.classList.remove('active'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('active');if(e.dataTransfer.files[0]){input.files=e.dataTransfer.files;show(e.dataTransfer.files[0])}});document.addEventListener('paste',e=>{const file=[...e.clipboardData.files].find(f=>f.type.startsWith('image/'));if(file){const dt=new DataTransfer();dt.items.add(file);input.files=dt.files;show(file)}})})()</script>
{{template "foot" .}}
{{end}}
